apiVersion: v1
kind: Secret
metadata:
  name: docverify-secrets
  namespace: docverify
type: Opaque
stringData:
  # Database credentials (CHANGE THESE IN PRODUCTION)
  DB_USER: "docverify_user"
  DB_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  
  # Ethereum private key (CHANGE THIS)
  ETHEREUM_PRIVATE_KEY: "CHANGE_ME_YOUR_PRIVATE_KEY"
  ETHEREUM_CONTRACT_ADDRESS: "0xYOUR_CONTRACT_ADDRESS"
  
  # JWT Secret
  JWT_SECRET: "CHANGE_ME_RANDOM_SECRET_256_BITS"
  
  # Redis password (if enabled)
  REDIS_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: fabric-credentials
  namespace: docverify
type: Opaque
stringData:
  # Fabric admin credentials
  FABRIC_ADMIN_USER: "admin"
  FABRIC_ADMIN_SECRET: "adminpw"
  
  # Connection profile (base64 encoded in production)
  connection-profile.json: |
    {
      "name": "docverify-network",
      "version": "1.0.0",
      "client": {
        "organization": "Org1",
        "connection": {
          "timeout": {
            "peer": { "endorser": "300" },
            "orderer": "300"
          }
        }
      },
      "organizations": {
        "Org1": {
          "mspid": "Org1MSP",
          "peers": ["peer0.org1.example.com"],
          "certificateAuthorities": ["ca.org1.example.com"]
        }
      },
      "peers": {
        "peer0.org1.example.com": {
          "url": "grpcs://peer0-org1-service:7051",
          "tlsCACerts": {
            "path": "/fabric/crypto/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem"
          }
        }
      },
      "certificateAuthorities": {
        "ca.org1.example.com": {
          "url": "https://ca-org1-service:7054",
          "caName": "ca-org1",
          "tlsCACerts": {
            "path": "/fabric/crypto/peerOrganizations/org1.example.com/ca/ca.org1.example.com-cert.pem"
          }
        }
      }
    }
