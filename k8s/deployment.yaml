apiVersion: apps/v1
kind: Deployment
metadata:
  name: docverify-backend
  namespace: docverify
  labels:
    app: docverify
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: docverify
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: docverify
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: docverify-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: backend
        image: docverify/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: docverify-config
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: docverify-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: docverify-secrets
              key: DB_PASSWORD
        - name: ETHEREUM_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: docverify-secrets
              key: ETHEREUM_PRIVATE_KEY
        - name: ETHEREUM_CONTRACT_ADDRESS
          valueFrom:
            secretKeyRef:
              name: docverify-secrets
              key: ETHEREUM_CONTRACT_ADDRESS
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: docverify-secrets
              key: JWT_SECRET
        volumeMounts:
        - name: fabric-config
          mountPath: /fabric/config
          readOnly: true
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: fabric-config
        secret:
          secretName: fabric-credentials
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - docverify
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: docverify-backend-service
  namespace: docverify
  labels:
    app: docverify
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: docverify
    component: backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docverify-backend
  namespace: docverify
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docverify-backend-hpa
  namespace: docverify
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docverify-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: docverify-backend-pdb
  namespace: docverify
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: docverify
      component: backend
