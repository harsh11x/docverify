version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: docverify-postgres
    environment:
      POSTGRES_DB: docverify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - docverify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IPFS Node
  ipfs:
    image: ipfs/kubo:latest
    container_name: docverify-ipfs
    ports:
      - "4001:4001" # P2P
      - "5001:5001" # API
      - "8080:8080" # Gateway
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - docverify-network
    healthcheck:
      test: ["CMD-SHELL", "ipfs id"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (for rate limiting and caching)
  redis:
    image: redis:7-alpine
    container_name: docverify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docverify-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ganache (Local Ethereum for development)
  ganache:
    image: trufflesuite/ganache:latest
    container_name: docverify-ganache
    ports:
      - "8545:8545"
    command: >
      --mnemonic "test test test test test test test test test test test junk"
      --networkId 1337
      --chainId 1337
      --accounts 10
      --defaultBalanceEther 1000
    networks:
      - docverify-network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: docverify-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: docverify
      DB_USER: postgres
      DB_PASSWORD: postgres
      IPFS_HOST: ipfs
      IPFS_PORT: 5001
      IPFS_PROTOCOL: http
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ETHEREUM_RPC_URL: http://ganache:8545
      ETHEREUM_NETWORK: development
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      redis:
        condition: service_healthy
      ganache:
        condition: service_started
    networks:
      - docverify-network
    command: npm run dev

networks:
  docverify-network:
    driver: bridge

volumes:
  postgres_data:
  ipfs_data:
  redis_data:
